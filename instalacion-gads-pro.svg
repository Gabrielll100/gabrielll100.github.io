<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101d"/><stop offset="1" stop-color="#0d2b46"/></linearGradient><linearGradient id="c" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#1bdcff"/><stop offset="1" stop-color="#5c66ff"/></linearGradient></defs><rect width="1200" height="620" rx="34" fill="url(#b)"/><text x="70" y="78" fill="white" font-family="Arial" font-size="40" font-weight="900">Instalación sencilla</text><text x="70" y="120" fill="#9bc3dc" font-family="Arial" font-size="19">Guía visual para preparar tu Android antes de instalar GADS PRO</text><g font-family="Arial"><g transform="translate(70 190)"><circle cx="35" cy="35" r="35" fill="url(#c)"/><text x="35" y="44" text-anchor="middle" fill="white" font-size="23" font-weight="900">1</text><text x="90" y="30" fill="white" font-size="23" font-weight="800">Descarga</text><text x="90" y="61" fill="#adc4d7" font-size="16">Usa el enlace publicado para obtener el APK.</text></g><g transform="translate(70 300)"><circle cx="35" cy="35" r="35" fill="url(#c)"/><text x="35" y="44" text-anchor="middle" fill="white" font-size="23" font-weight="900">2</text><text x="90" y="30" fill="white" font-size="23" font-weight="800">Revisa Android</text><text x="90" y="61" fill="#adc4d7" font-size="16">Android 6.0 o superior y espacio suficiente.</text></g><g transform="translate(70 410)"><circle cx="35" cy="35" r="35" fill="url(#c)"/><text x="35" y="44" text-anchor="middle" fill="white" font-size="23" font-weight="900">3</text><text x="90" y="30" fill="white" font-size="23" font-weight="800">Instala y revisa</text><text x="90" y="61" fill="#adc4d7" font-size="16">Lee los avisos de Android y revisa permisos.</text></g></g><g transform="translate(820 120)"><rect width="260" height="430" rx="38" fill="#050a12" stroke="#4edbff" stroke-width="3"/><rect x="18" y="52" width="224" height="350" rx="23" fill="#0b2036"/><text x="130" y="125" text-anchor="middle" fill="#69e7ff" font-family="Arial" font-size="20" font-weight="800">ANDROID</text><text x="130" y="160" text-anchor="middle" fill="white" font-family="Arial" font-size="28" font-weight="900">GADS PRO</text><rect x="46" y="210" width="168" height="44" rx="22" fill="url(#c)"/><text x="130" y="238" text-anchor="middle" fill="white" font-family="Arial" font-size="14" font-weight="800">INSTALAR</text><text x="130" y="300" text-anchor="middle" fill="#9bb8ce" font-family="Arial" font-size="13">Android 6+</text></g></svg>
